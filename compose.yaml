services:
  fastprinterapi_database:
    image: postgres:17
    volumes:
      - pgdata_main:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    mem_limit: 1gb
    cpus: 1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_user -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 5
  fastprinterapi_logs_database:
    image: postgres:17
    volumes:
      - pgdata_logs:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: app_logs_db
    ports:
      - "5433:5432"
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_user -d app_logs_db"]
      interval: 5s
      timeout: 5s
      retries: 5
  fastprinterapi_redis:
    image: redis:8.0
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    mem_limit: 1gb
    cpus: 0.5
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  fastprinterapi_app:
    image: fastprinterapi
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    mem_limit: 1024m
    cpus: 1
    depends_on:
      fastprinterapi_database:
        condition: service_healthy
      fastprinterapi_logs_database:
        condition: service_healthy
      fastprinterapi_redis:
        condition: service_healthy
    environment:
      # Banco de dados principal
      DATABASE_URL: postgresql+psycopg://postgres_user:postgres_password@fastprinterapi_database:5432/app_db
      # Banco de dados de logs
      DATABASE_LOGS_URL: postgresql+psycopg://postgres_user:postgres_password@fastprinterapi_logs_database:5432/app_logs_db
      # Redis
      REDIS_URL: redis://fastprinterapi_redis:6379/
    restart: unless-stopped

volumes:
  pgdata_main:
    name: fastprinterapi_pgdata_main
  pgdata_logs:
    name: fastprinterapi_pgdata_logs
  redis_data:
    name: fastprinterapi_redis_data

